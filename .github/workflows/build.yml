name: Build OLW for WordPress

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install .NET Framework 4.6.1 Developer Pack
        shell: pwsh
        run: choco install netfx-4.6.1-devpack -y --no-progress

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore src\managed\writer.sln

      - name: Build solution
        run: msbuild src\managed\writer.sln /p:Configuration=${{ matrix.configuration }} /nologo /maxcpucount /verbosity:minimal

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OLW-for-WordPress-${{ matrix.configuration }}
          path: src\managed\bin\${{ matrix.configuration }}\i386\Writer\
          retention-days: 30

  create-installer:
    needs: build
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install .NET Framework 4.6.1 Developer Pack
        shell: pwsh
        run: choco install netfx-4.6.1-devpack -y --no-progress

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore src\managed\writer.sln

      - name: Build Release
        run: msbuild src\managed\writer.sln /p:Configuration=Release /nologo /maxcpucount /verbosity:minimal

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = Get-Content version.txt -Raw
          $version = $version.Trim()
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Create NuGet package
        shell: pwsh
        run: |
          nuget pack OpenLiveWriter.nuspec -version ${{ steps.version.outputs.VERSION }} -basepath src\managed\bin\Release\i386\Writer
          # Find the actual nupkg file (NuGet may normalize version)
          $nupkg = Get-ChildItem -Filter "OpenLiveWriter.*.nupkg" | Select-Object -First 1
          echo "NUPKG=$($nupkg.Name)" >> $env:GITHUB_OUTPUT
          echo "Found package: $($nupkg.Name)"
        id: nuget_pack

      - name: Create installer with Squirrel
        shell: cmd
        run: |
          src\managed\packages\squirrel.windows.1.4.4\tools\Squirrel.exe --no-msi --releasify ${{ steps.nuget_pack.outputs.NUPKG }}
          IF EXIST Releases\Setup.exe MOVE Releases\Setup.exe Releases\OLWforWordPressSetup.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OLW-for-WordPress-Installer
          path: Releases\
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          files: Releases\OLWforWordPressSetup.exe
          generate_release_notes: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
